<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java WASM Todo Application</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        #todo-app {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
<div id="todo-app"></div>

<script src="../../src/main/resources/javaw-runtime.js"></script>
<script>
    async function run() {
        try {
            const response = await fetch('TodoApp.wasm');
            const wasmBytes = await response.arrayBuffer();
            const { exports } = await Javaw.instantiateJavaw(wasmBytes, {}, document);

            // Execute the Java entry point
            if (exports.start) {
                exports.start();
            } else if (exports.main) {
                exports.main();
            }
        } catch (err) {
            console.error("Failed to run TodoApp:", err);
        }
    }
    window.addEventListener('DOMContentLoaded', run);
</script>
</body>
</html>
