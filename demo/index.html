<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java WebAssembly DOM Application</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        #app {
            background: #1e293b;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #334155;
        }
        .app-title {
            color: #f8fafc;
            margin-top: 0;
            font-size: 24px;
        }
        #status-text {
            font-size: 18px;
            color: #94a3b8;
            margin: 20px 0;
        }
        button {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #2563eb;
        }
        #terminal-container {
            max-width: 650px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="terminal-container"></div>

    <script src="../javaw-core/src/main/resources/javaw-runtime.js"></script>
    <script>
        if (typeof Javaw === 'undefined') {
            document.write('<script src="../src/main/resources/javaw-runtime.js"><\/script>');
        }
    </script>
    <script>
        async function init() {
            try {
                const response = await fetch('../src/test/java/dastec/one/javaw/App.wasm');
                const wasmBytes = await response.arrayBuffer();
                const runtime = new Javaw.JavawRuntime(document);
                const term = runtime.createTerminal('#terminal-container', {
                    prompt: 'javaw> ',
                    title: 'javaw WASI Interactive Terminal & REPL'
                });

                const { exports } = await Javaw.instantiateJavaw(wasmBytes, {}, document);
                if (exports.start) {
                    exports.start();
                }
            } catch (err) {
                console.error("Failed to initialize Java WASM app:", err);
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
