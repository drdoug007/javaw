<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java WebAssembly DOM Application</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        #app {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .app-title {
            color: #1a202c;
            margin-top: 0;
            font-size: 24px;
        }
        #status-text {
            font-size: 18px;
            color: #4a5568;
            margin: 20px 0;
        }
        button {
            background-color: #3182ce;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="../src/main/resources/javaw-runtime.js"></script>
    <script>
        async function init() {
            try {
                const response = await fetch('../src/test/java/com/example/javaw/App.wasm');
                const wasmBytes = await response.arrayBuffer();
                const { exports } = await Javaw.instantiateJavaw(wasmBytes);
                if (exports.start) {
                    exports.start();
                }
            } catch (err) {
                console.error("Failed to initialize Java WASM app:", err);
            }
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
